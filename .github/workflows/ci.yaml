name: CI
on:
  pull_request:
  push:
    branches:
    - 'main'
jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-go
      with:
        bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
    - uses: ./.github/actions/aqua
    - run: make lint
    - run: make test-e2e
    - name: Dump logs on failure
      if: failure()
      run: |
        kubectl -n login-protector-system logs deploy/login-protector-controller-manager --all-containers || true
        kubectl get pods -A -o wide || true
        kubectl get pod -l name=target-sts -o yaml || true
        kubectl logs -l name=target-sts -c local-session-tracker --prefix --tail=-1 || true
